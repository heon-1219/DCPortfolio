<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <title>Financial Product Agent pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffffff" fill-opacity="0.7" />
    </marker>
  </defs>

  <!-- Question -->
  <rect x="16" y="64" width="124" height="52" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="78" y="98" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Question</text>

  <!-- Routed stores -->
  <g font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="238" y="20" width="236" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />
    <text x="356" y="49">SQL Database</text>
    <rect x="238" y="69" width="236" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />
    <text x="356" y="98">Knowledge Graph</text>
    <rect x="238" y="118" width="236" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />
    <text x="356" y="147">Hybrid Search</text>
  </g>

  <!-- Question -> stores -->
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 140 90 C 190 90 190 41 234 41" />
    <path d="M 140 90 L 234 90" />
    <path d="M 140 90 C 190 90 190 139 234 139" />
  </g>

  <!-- Stores -> answer -->
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 474 41 C 526 41 526 90 574 90" />
    <path d="M 474 90 L 574 90" />
    <path d="M 474 139 C 526 139 526 90 574 90" />
  </g>

  <!-- Grounded answer -->
  <rect x="580" y="60" width="124" height="60" rx="10" fill="#ffd500" />
  <text x="642" y="86" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle">Grounded</text>
  <text x="642" y="109" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle">Answer</text>

  <!-- Divider -->
  <line x1="24" y1="184" x2="696" y2="184" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" />

  <!-- Headline stats -->
  <g text-anchor="middle">
    <text x="120" y="238" font-size="42" font-weight="bold" fill="#ffffff">1.08M</text>
    <text x="120" y="268" font-size="19" fill="#ffffff" fill-opacity="0.78">graph triples</text>
    <text x="360" y="238" font-size="42" font-weight="bold" fill="#ffffff">75K</text>
    <text x="360" y="268" font-size="19" fill="#ffffff" fill-opacity="0.78">indexed documents</text>
    <text x="600" y="238" font-size="42" font-weight="bold" fill="#ffffff">87%</text>
    <text x="600" y="268" font-size="19" fill="#ffffff" fill-opacity="0.78">on 54-question eval</text>
  </g>
</svg>
